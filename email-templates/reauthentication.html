<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your Recall verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">

  <!-- Preheader (hidden preview text) -->
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">Your Recall verification code.</div>
  <!-- /Preheader -->

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f7;padding:40px 16px;">
    <tr>
      <td align="center">

        <!-- Card -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;border-radius:14px;border:1px solid #e5e7eb;padding:32px;">
          <tr>
            <td align="center" style="padding:32px 32px 0 32px;">

              <!-- Logo -->
              <img src="https://cesmsdnblkdjkskmiqib.supabase.co/storage/v1/object/public/brand-assets/recall-logo.png"
                   alt="Recall"
                   width="56"
                   height="56"
                   style="display:block;width:56px;height:56px;border-radius:14px;margin:0 auto 12px auto;">

              <!-- Wordmark -->
              <p style="margin:0 0 28px 0;font-size:13px;font-weight:700;letter-spacing:0.12em;color:#111827;text-transform:uppercase;">RECALL</p>

              <!-- Heading -->
              <h1 style="margin:0 0 12px 0;font-size:24px;font-weight:700;color:#111827;line-height:1.3;">Confirm it's you</h1>

              <!-- Body -->
              <p style="margin:0 0 24px 0;font-size:16px;line-height:1.55;color:#111827;">To complete this action on your Recall account, enter the verification code below in the app.</p>

              <!-- OTP Code Block -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto 24px auto;">
                <tr>
                  <td align="center" style="background-color:#f4f5f7;border-radius:10px;padding:16px 28px;">
                    <span style="font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:700;letter-spacing:6px;color:#111827;display:block;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>

              <!-- Expiry note -->
              <p style="margin:0 0 0 0;font-size:14px;line-height:1.55;color:#6b7280;">This code expires in 1 hour.</p>

            </td>
          </tr>
        </table>
        <!-- /Card -->

        <!-- Footer -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;margin-top:24px;">
          <tr>
            <td align="center" style="padding:0 16px;">
              <p style="margin:0 0 6px 0;font-size:13px;color:#6b7280;line-height:1.5;">If you didn't request this, you can safely ignore this email.</p>
              <p style="margin:0;font-size:13px;color:#6b7280;line-height:1.5;">
                <a href="mailto:support@recall.app" style="color:#6b7280;text-decoration:underline;">support@recall.app</a>
                &nbsp;&middot;&nbsp;
                &copy; 2025 Recall
              </p>
            </td>
          </tr>
        </table>
        <!-- /Footer -->

      </td>
    </tr>
  </table>

</body>
</html>
